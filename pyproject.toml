[project]
name = "virtujudge-backend"
version = "0.1.0"
description = "VirtuJudge control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "defusedxml>=0.7.1",
    "email-validator>=2.3.0",
    "boto3==1.43.88",
    "fastapi==0.141.1",
    "httpx==0.28.1",
    "psycopg2-binary>=2.9.12",
    "psycopg[binary]==3.3.5",
    "cryptography>=42.0.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "pyjwt>=2.13.0",
    "pypdf>=5.0.0",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "fakeredis>=2.38.0",
    "pytest-asyncio>=1.4.0",
    "jsonschema==4.26.0",
    "mypy==2.3.1",
    "openapi-spec-validator==0.9.0",
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["alembic.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true
