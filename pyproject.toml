[project]
name = "virtujudge-backend"
version = "0.1.0"
description = "VirtuJudge control plane"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "fastapi==0.141.1",
    "psycopg[binary]==3.3.5",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.0.52",
    "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
    "aiosqlite==0.22.1",
    "httpx==0.28.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true
