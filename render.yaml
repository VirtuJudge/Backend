services:
  - type: keyvalue
    name: virtujudge-redis
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: "off"

  - type: web
    name: virtujudge-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: virtujudge-redis
          property: connectionString
      - key: REDIS_CACHE_URL
        fromService:
          type: keyvalue
          name: virtujudge-redis
          property: connectionString
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: OIDC_ISSUER
        sync: false
      - key: OIDC_AUDIENCE
        sync: false
      - key: OIDC_JWKS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_BACKEND
        value: gmail
      - key: GMAIL_SMTP_HOST
        value: smtp.gmail.com
      - key: GMAIL_SMTP_PORT
        value: "587"
      - key: GMAIL_SMTP_USERNAME
        sync: false
      - key: GMAIL_SMTP_PASSWORD
        sync: false
      - key: GMAIL_FROM_ADDRESS
        sync: false
      - key: ASSET_CLEANUP_ENABLED
        value: "true"
