name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: virtujudge_test
          POSTGRES_PASSWORD: virtujudge_test
          POSTGRES_DB: virtujudge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U virtujudge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv==0.11.8

      - name: Install media validation tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync --locked

      - name: Run checks
        env:
          ASSET_TEST_DATABASE_URL: postgresql+asyncpg://virtujudge_test:virtujudge_test@localhost:5432/virtujudge_test
          PROJECT_TEST_DATABASE_URL: postgresql+asyncpg://virtujudge_test:virtujudge_test@localhost:5432/virtujudge_test
        run: bash scripts/check.sh
